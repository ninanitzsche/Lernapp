<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
<title id="title">Nicos verwunschener Waldpfad</title><desc id="desc">Ein warmer, verwunschener Wald mit moosbewachsenen Wurzeln, einem Wasserfall, Kristallen und einer natürlichen Holzplattform.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#f8c66c"/><stop offset=".34" stop-color="#477c63"/><stop offset=".72" stop-color="#123e36"/><stop offset="1" stop-color="#092b28"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#a7fff0"/><stop offset=".45" stop-color="#32c9c1"/><stop offset="1" stop-color="#087e83"/></linearGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#d69a55"/><stop offset=".38" stop-color="#9b6036"/><stop offset="1" stop-color="#593a2b"/></linearGradient>
 <linearGradient id="woodTop" x2="0" y2="1"><stop stop-color="#f3c27b"/><stop offset=".5" stop-color="#bd8148"/><stop offset="1" stop-color="#85502f"/></linearGradient>
 <linearGradient id="leaf" x2="0" y2="1"><stop stop-color="#b5d86b"/><stop offset="1" stop-color="#286b45"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff1b7" stop-opacity=".85"/><stop offset="1" stop-color="#fff1b7" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="900" height="1600" fill="url(#sky)"/>
<ellipse cx="190" cy="210" rx="300" ry="260" fill="url(#sun)"/>

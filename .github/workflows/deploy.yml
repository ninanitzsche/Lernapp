name: Deploy auf GitHub Pages

# Bei jedem Push auf main: testen, bauen und die App auf GitHub Pages veröffentlichen.
# Einmalig nötig: im Repo unter Settings, Pages, bei "Source" die Option "GitHub Actions" wählen
# und dort die eigene (Sub-)Domain eintragen. Bei STRATO zeigt ein CNAME-Eintrag der Subdomain auf ninanitzsche.github.io.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
